info:
  contact: {}
  description: SCM Ads API documentation. Access is controlled via JWT + RBAC permissions.
    Super admins/admins have global access; advertiser users are scoped server-side
    to resources they own (via advertisers.created_by).
  title: SCM Ads API
  version: 1.0.0
paths:
  /adposters/_all_docs:
    get:
      description: Returns CouchDB-style _all_docs response with all active and scheduled
        ad_posters. Supports include_docs and region filter.
      parameters:
      - description: Include full document in response
        in: query
        name: include_docs
        type: boolean
      - description: Limit number of results
        in: query
        name: limit
        type: integer
      - description: Skip number of results
        in: query
        name: skip
        type: integer
      - description: Filter by region (e.g., au, jct)
        in: query
        name: region
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: CouchDB-style response with total_rows, offset, and rows array
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all ad_posters metadata
      tags:
      - Legacy
  /adposters/{id}:
    get:
      description: Returns a single ad_poster document with _id and _rev fields in
        CouchDB/Sync Gateway style
      parameters:
      - description: Ad Poster ID (external_id)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ad Poster document with _id, _rev, and all ad_poster fields
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Ad Poster not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get ad_poster by ID
      tags:
      - Legacy
  /api/v1/advertisers/:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Advertiser'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List advertisers
      tags:
      - Advertisers
    post:
      consumes:
      - application/json
      parameters:
      - description: Create advertiser request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateAdvertiserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Advertiser'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create advertiser
      tags:
      - Advertisers
  /api/v1/advertisers/{id}/:
    delete:
      parameters:
      - description: Advertiser ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete advertiser
      tags:
      - Advertisers
    get:
      parameters:
      - description: Advertiser ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Advertiser'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get advertiser
      tags:
      - Advertisers
    put:
      consumes:
      - application/json
      parameters:
      - description: Advertiser ID
        in: path
        name: id
        required: true
        type: string
      - description: Update advertiser request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateAdvertiserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Advertiser'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update advertiser
      tags:
      - Advertisers
  /api/v1/advertisers/search:
    get:
      parameters:
      - description: Search text (matches name or email)
        in: query
        name: query
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
