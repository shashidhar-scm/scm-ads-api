      description: Returns loop document with _id, _rev, and cards array in CouchDB/Sync
        Gateway style. Supports conditional fetching via If-None-Match header with
        ETag.
      parameters:
      - description: Device hostname or identifier (e.g., U696843)
        in: path
        name: device
        required: true
        type: string
      - description: ETag from previous response for conditional fetch
        in: header
        name: If-None-Match
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Loop document with _id, _rev, cards, city, device_code, device_type,
            loopPosterId, region
          schema:
            additionalProperties: true
            type: object
        "304":
          description: Not Modified - content unchanged since last fetch
        "404":
          description: Loop not found for device
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
